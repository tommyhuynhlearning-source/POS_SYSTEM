server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  location /api/catalog/ { proxy_pass http://catalog:3001/api/catalog/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/orders/ { proxy_pass http://orders:3002/api/orders/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /api/catalog { proxy_pass http://catalog:3001/api/catalog; }
  location = /api/orders { proxy_pass http://orders:3002/api/orders; }
  location / { try_files $uri $uri/ /index.html; }
}
