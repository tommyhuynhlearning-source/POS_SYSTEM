services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]

  catalog:
    build: ./services/catalog
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: pos
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: pos_catalog
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      TZ: ${APP_TIMEZONE:-UTC}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  orders:
    build: ./services/orders
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: pos
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: pos_orders
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      TZ: ${APP_TIMEZONE:-UTC}
      CATALOG_URL: http://catalog:3001
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      PORT: 3002
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  web:
    build:
      context: ./apps/web
      args:
        VITE_CURRENCY: ${CURRENCY:-USD}
        VITE_TIMEZONE: ${APP_TIMEZONE:-UTC}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      catalog:
        condition: service_healthy
      orders:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
